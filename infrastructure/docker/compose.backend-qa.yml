# Optional real Backend tests. Source must exist at QA_SOURCE_ROOT.
services:
  db-test:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: app05_test
      POSTGRES_USER: app05_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run dev.py init first}
      TZ: UTC
    # Deliberately no host port or persistent volume: only disposable test data.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U app05_test -d app05_test']
      interval: 3s
      timeout: 3s
      retries: 20

  backend-qa:
    build:
      context: .
      dockerfile: Dockerfile.backend-qa
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://app05_test:${POSTGRES_PASSWORD}@db-test:5432/app05_test
      TEST_DATABASE_URL: postgresql+psycopg://app05_test:${POSTGRES_PASSWORD}@db-test:5432/app05_test
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      QA_REPORT_DIR: /reports
    volumes:
      - ${QA_SOURCE_ROOT:-../..}:/target:ro
      - ../../tests/integration/qa_backend:/extra-tests:ro
      - ../../build/qa:/reports
