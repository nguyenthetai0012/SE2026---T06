name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini Code Review
        uses: sshnaidm/gemini-code-review-action@v2
        with:
          gemini-key: ${{ secrets.GEMINI_API_KEY }}
          model: "gemini-3.8-flash"
          prompt: |
            Bạn là trợ lý review code cho đồ án sinh viên. Hãy nhận xét bằng tiếng Việt.
            Tập trung vào:
            1. Các lỗi logic hoặc tiềm ẩn bug.
            2. Tối ưu hiệu năng và khả năng đọc code.
            3. Đưa ra gợi ý code sửa đổi cụ thể (nếu có).
