name: Gemini Issue Assistant

on:
  issues:
    types: [opened]

jobs:
  analyze_issue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Gemini Phân tích Issue
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const title = process.env.ISSUE_TITLE || '';
            const body = process.env.ISSUE_BODY || '(không có mô tả)';
            const apiKey = process.env.GEMINI_API_KEY;
            const model = process.env.GEMINI_MODEL;
            const header = '🤖 **Trợ lý Gemini gợi ý lộ trình thực hiện** (gợi ý tự động, không phải quyết định của nhóm):';

            async function comment(text) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: text,
              });
            }

            // Báo lỗi rõ ràng và đánh dấu job thất bại; không ghi giá trị secret hay toàn bộ response.
            async function fail(reason) {
              await comment(`${header}\n\n⚠️ Không tạo được gợi ý: ${reason}\n\nJob này được đánh dấu **thất bại** để nhóm kiểm tra; xem log của workflow run.`);
              core.setFailed(reason);
            }

            if (!apiKey) {
              return fail('chưa cấu hình secret `GEMINI_API_KEY` cho repository.');
            }

            const prompt = `Bạn là trợ lý AI hỗ trợ quản lý đồ án sinh viên APP-05 Smart Campus Energy Dashboard.
            Quy tắc:
            - Chỉ gợi ý trong phạm vi APP-05 (README.md, docs/) và phạm vi của chính Issue này.
            - Mọi công nghệ/thư viện bạn nêu chỉ là ĐỀ XUẤT, không phải quyết định đã được nhóm duyệt; ghi rõ điều đó.
            - Không tuyên bố đã kiểm thử, build hay chạy được bất cứ thứ gì.
            Issue mới:
            - Tiêu đề: ${title}
            - Mô tả: ${body}

            Hãy viết phản hồi bằng tiếng Việt dạng Markdown gồm:
            1. 🎯 Tóm tắt mục tiêu
            2. 📋 Danh sách các việc cần làm (Checklist)
            3. 💡 Gợi ý hướng triển khai (đề xuất, chờ nhóm duyệt)
            4. ⚠️ Lưu ý rủi ro/bảo mật`;

            let response;
            try {
              response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                method: 'POST',
                // Key gửi qua header, không nằm trên URL (tránh lộ qua log/proxy).
                headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
                signal: AbortSignal.timeout(60000),
              });
            } catch (err) {
              return fail(`không gọi được Gemini API (${err.name}).`);
            }

            let data = null;
            try {
              data = await response.json();
            } catch (err) {
              data = null;
            }

            if (!response.ok) {
              const status = data?.error?.status ? ` ${data.error.status}` : '';
              core.info(`Gemini API message: ${String(data?.error?.message ?? '').slice(0, 300)}`);
              return fail(`Gemini API trả về HTTP ${response.status}${status} (model \`${model}\`).`);
            }

            const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!reply) {
              const why = data?.promptFeedback?.blockReason || data?.candidates?.[0]?.finishReason || 'không có candidates';
              return fail(`Gemini API trả HTTP ${response.status} nhưng không có nội dung (${why}).`);
            }

            await comment(`${header}\n\n${reply}`);
