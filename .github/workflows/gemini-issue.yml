name: Gemini Issue Assistant

on:
  issues:
    types: [opened]

jobs:
  analyze_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Gemini Phân tích Issue
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const body = process.env.ISSUE_BODY;
            const apiKey = process.env.GEMINI_API_KEY;

            const prompt = `Bạn là trợ lý AI hỗ trợ quản lý đồ án sinh viên. 
            Dưới đây là một Issue mới trong dự án:
            - Tiêu đề: ${title}
            - Mô tả: ${body}

            Hãy viết một phản hồi bằng tiếng Việt dạng Markdown gồm:
            1. 🎯 Tóm tắt mục tiêu
            2. 📋 Danh sách các việc cần làm (Checklist)
            3. 💡 Gợi ý hướng triển khai / Thư viện nên dùng
            4. ⚠️ Lưu ý rủi ro/bảo mật`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Không thể phân tích Issue này.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Trợ lý Gemini gợi ý lộ trình thực hiện:**\n\n${reply}`
            });
