name: QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Documents and MQTT fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check JSON, local links, Python syntax and diff
        run: python3 tools/scripts/check_repo.py
      - name: Check proposed MQTT fixtures and oracle
        run: python3 -m unittest discover -s tests/integration -p 'test_contract_*.py' -v

  infrastructure:
    name: PostgreSQL and MQTT smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/scripts/dev.py init
      - run: python3 tools/scripts/dev.py config
      - run: python3 tools/scripts/dev.py up
      - run: python3 tools/scripts/dev.py smoke
      - if: always()
        run: python3 tools/scripts/dev.py down

  backend:
    name: Backend API and MQTT pipeline integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/scripts/dev.py init
      - name: Test Backend and Simulator through a real broker in a disposable database
        run: python3 tools/scripts/backend_qa.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-evidence
          path: build/qa/
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: >-
          docker compose --project-name app05-ngoc-qa --env-file .env
          -f infrastructure/docker/compose.yml
          -f infrastructure/docker/compose.backend-qa.yml down

# This integration branch includes unmerged PRs #35, #41 and #46.
# Infrastructure smoke alone is not evidence of application ingestion.
